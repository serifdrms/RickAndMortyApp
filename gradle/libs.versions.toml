recyclerview = "1.4.0"
cardview = "1.0.0"
navigation = "2.9.5"
lifecycle = "2.9.4"
glide = "5.0.5"
retrofit = "3.0.0"
okhttp = "5.3.0"
paging = "3.3.6"
